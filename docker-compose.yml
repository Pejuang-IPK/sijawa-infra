version: "3.9"

services:
  php:
    build: ./php-fpm
    container_name: php_fpm
    volumes:
      - ../sijawa-web/src:/var/www/html
    networks:
      - infra_net
    restart: always

  mysql:
    image: mysql:8
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS} # Sebaiknya gunakan .env file
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - infra_net
    restart: always

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASS}
    # Port 8081 dihapus, akses via subdomain Nginx
    depends_on:
      - mysql
    networks:
      - infra_net
    restart: always

  minio:
    image: minio/minio:latest
    container_name: minio_s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    volumes:
      - minio_data:/data
    # Port dihapus, akses via Nginx
    networks:
      - infra_net
    restart: always

  # nagios:
  #   build: ./nagios
  #   container_name: nagios_monitor
  #   # Port 8082 dihapus
  #   depends_on:
  #     - mysql
  #   networks:
  #     - infra_net
  #   restart: always

volumes:
  db_data:
  minio_data:

networks:
  infra_net:
    external: true
