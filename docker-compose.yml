version: "3.9"

services:
  php:
    build: ./php-fpm
    container_name: php_fpm
    volumes:
      - ../sijawa-web/src:/var/www/html
    networks:
      - infra_net

  nginx:
    image: nginx:latest
    container_name: nginx_sijawa
    ports:
      - "80:80"
    volumes:
      - ../sijawa-web/src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - infra_net

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - infra_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - infra_net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # API / S3 endpoint
      - "9001:9001" # Web Console
    networks:
      - infra_net

  nagios:
    build: ./nagios
    container_name: nagios_sijawa
    ports:
      - "8082:80"
    depends_on:
      - mysql
    networks:
      - infra_net

volumes:
  db_data:
  minio_data:

networks:
  infra_net:
    driver: bridge
