version: "3.9"

services:
  php:
    build: ./php-fpm
    container_name: php_fpm
    volumes:
      - ../sijawa-web/src:/var/www/html
    networks:
      - infra_net
    restart: always

  mysql:
    image: mysql:8
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - infra_net
    restart: always

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpass
    networks:
      - infra_net
    restart: always

  minio:
    image: minio/minio
    container_name: minio_s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopass
    volumes:
      - minio_data:/data
    networks:
      - infra_net
    restart: always

volumes:
  db_data:
  minio_data:

networks:
  infra_net:
    external: true
